<!DOCTYPE html>
<!--现实的语言-->
<html lang="en">
<head>
    <!--编码方式-->
    <meta charset="UTF-8">
    <!--网站名-->
    <title>上传文件</title>
</head>
<body>

<!--文件上传的参数设置
action---提交地址，表单数据发送到哪个 URL（后端接口地址）
method---请求方式，文件上传用post
emctype---编码类型，文件上传必须用 multipart/form-data
-->
<form action="/upload" method="post" enctype="multipart/form-data">
    姓名：<input type="text" name="username"><br>
    年龄：<input type="text" name="age"><br>
    头像：<input type="file" name="image"><br>
    <input type="submit" value="提交">
</form>

</body>
