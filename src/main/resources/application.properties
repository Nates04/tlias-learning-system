#port
server.port=8080

#mapper--.xml
mybatis.mapper-locations=classpath:com/wust/ems/mapper/*.xml

#pojo
mybatis.type-aliases-package=com.wust.ems.pojo

#mysql
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://192.168.235.10:3306/weblogdb
spring.datasource.username=root
spring.datasource.password=#

#mybatis
mybatis.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

#mybatis,   a_age----->aAge
mybatis.configuration.map-underscore-to-camel-case=true

#onefilesizemax
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=100MB

#springlog
logging.level.org.springframework.jdbc.support.JdbcTransactionManager=true

